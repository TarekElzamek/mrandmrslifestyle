<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr & Mrs Lifestyle | Elite Online Coaching Dubai & Worldwide</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8D08A;
    --gold-dark: #8B6914;
    --black: #0A0A0A;
    --off-black: #111111;
    --charcoal: #1C1C1C;
    --dark-gray: #2A2A2A;
    --mid-gray: #555;
    --light-gray: #888;
    --off-white: #F8F5F0;
    --white: #FFFFFF;
    --accent-red: #C0392B;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'DM Sans', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background: var(--black);
    color: var(--white);
    overflow-x: hidden;
  }
  /* ── FIXED SITE HEADER ── */
  .site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
  }
  .site-header nav {
    position: relative !important;
    top: auto !important;
  }
  /* Push hero content below fixed header */
  .hero { padding-top: 13rem; }
  @media (max-width: 768px) {
    .hero { padding-top: 7.5rem; }
    .site-header { width: 100%; }
    .urgency-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      font-size: 0.62rem !important;
      padding: 0.4rem 0.8rem !important;
      line-height: 1.4;
      text-align: center;
    }
    .urgency-banner span {
      font-size: 0.6rem !important;
    }
  }
  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 3rem;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(201,168,76,0.15);
  }
  .nav-logo {
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.03em;
    text-decoration: none;
  }
  .nav-links {
    display: flex; gap: 2rem; list-style: none;
  }
  .nav-links a {
    font-size: 0.82rem;
    font-weight: 500;
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-cta {
    background: var(--gold);
    color: var(--black) !important;
    padding: 0.5rem 1.4rem;
    border-radius: 2px;
    font-weight: 600 !important;
    letter-spacing: 0.05em !important;
    transition: background 0.2s !important;
  }
  .nav-cta:hover { background: var(--gold-light) !important; }
  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 3rem;
    position: relative;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background:
      linear-gradient(135deg, rgba(10,10,10,0.97) 0%, rgba(28,28,28,0.85) 100%),
      url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1800&q=80') center/cover no-repeat;
  }
  .hero-accent {
    position: absolute; top: -200px; right: -200px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-content { position: relative; z-index: 2; max-width: 750px; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 0.75rem;
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--gold);
    margin-bottom: 1.5rem;
  }
  .hero-eyebrow::before {
    content: ''; display: block;
    width: 30px; height: 1px; background: var(--gold);
  }
  .hero h1 {
    font-family: var(--font-display);
    font-size: clamp(3rem, 7vw, 6rem);
    font-weight: 900;
    line-height: 1.0;
    margin-bottom: 1.5rem;
    letter-spacing: -0.01em;
  }
  .hero h1 em {
    font-style: italic;
    color: var(--gold);
  }
  .hero-sub {
    font-size: 1.15rem;
    color: rgba(255,255,255,0.7);
    line-height: 1.7;
    max-width: 520px;
    margin-bottom: 2.5rem;
    font-weight: 300;
  }
  .hero-stats {
    display: flex; gap: 3rem;
    margin-bottom: 3rem;
    padding-bottom: 2.5rem;
    border-bottom: 1px solid rgba(201,168,76,0.2);
  }
  .stat-num {
    font-family: var(--font-display);
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }
  .stat-label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-top: 0.3rem;
  }
  .hero-ctas {
    display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
  }
  .btn-primary {
    display: inline-block;
    background: var(--gold);
    color: var(--black);
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 1rem 2rem;
    border-radius: 2px;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
  }
  .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 0.5rem;
    color: rgba(255,255,255,0.8);
    font-size: 0.85rem; font-weight: 500;
    text-decoration: none;
    letter-spacing: 0.05em;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    padding-bottom: 2px;
    transition: color 0.2s;
  }
  .btn-ghost:hover { color: var(--gold); border-color: var(--gold); }
  .scroll-indicator {
    position: absolute; bottom: 0.75rem; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    color: rgba(255,255,255,0.3);
    font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase;
    animation: bounce 2s infinite;
  }
  .scroll-indicator::after {
    content: '↓'; font-size: 1rem; color: var(--gold);
  }
  @keyframes bounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(6px); }
  }
  /* ── URGENCY BANNER ── */
  .urgency-banner {
    background: var(--gold);
    color: var(--black);
    text-align: center;
    padding: 0.6rem 1rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.5;
  }
  .urgency-banner span {
    background: var(--black);
    color: var(--gold);
    padding: 0.15rem 0.6rem;
    border-radius: 2px;
    margin-left: 0.5rem;
    font-size: 0.7rem;
    display: inline-block;
  }
  /* ── SECTIONS ── */
  section { padding: 6rem 3rem; }
  .section-eyebrow {
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--gold);
    margin-bottom: 1rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .section-eyebrow::before {
    content: ''; display: block;
    width: 24px; height: 1px; background: var(--gold);
  }
  .section-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 4vw, 3.2rem);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 1.5rem;
  }
  .section-title em { font-style: italic; color: var(--gold); }
  /* ── LEAD MAGNET ── */
  .lead-magnet {
    background: var(--charcoal);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 4px;
    padding: 3rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    align-items: center;
    max-width: 1100px;
    margin: 0 auto;
  }
  .lead-magnet h2 {
    font-family: var(--font-display);
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 1rem;
    line-height: 1.15;
  }
  .lead-magnet p {
    color: rgba(255,255,255,0.65);
    font-size: 1rem;
    line-height: 1.7;
    margin-bottom: 1.5rem;
  }
  .email-form {
    display: flex; gap: 0;
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid rgba(201,168,76,0.4);
  }
  .email-form input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: none;
    padding: 0.85rem 1.2rem;
    color: var(--white);
    font-family: var(--font-body);
    font-size: 0.9rem;
    outline: none;
  }
  .email-form input::placeholder { color: rgba(255,255,255,0.35); }
  .email-form button {
    background: var(--gold);
    color: var(--black);
    border: none;
    padding: 0.85rem 1.5rem;
    font-family: var(--font-body);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .email-form button:hover { background: var(--gold-light); }
  .lead-visual {
    background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(201,168,76,0.02));
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 4px;
    padding: 2.5rem;
    text-align: center;
  }
  .lead-visual .freebie-label {
    font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 1rem;
  }
  .lead-visual h3 {
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
    line-height: 1.2;
  }
  .lead-perks {
    list-style: none;
    text-align: left;
    margin-top: 1.5rem;
  }
  .lead-perks li {
    font-size: 0.88rem;
    color: rgba(255,255,255,0.7);
    padding: 0.4rem 0;
    padding-left: 1.5rem;
    position: relative;
  }
  .lead-perks li::before {
    content: '✓';
    position: absolute; left: 0;
    color: var(--gold);
    font-weight: 700;
  }
  /* ── TRANSFORMATIONS ── */
  .transformations-section {
    background: var(--off-black);
  }
  .transforms-header {
    text-align: center;
    margin-bottom: 4rem;
  }
  .transforms-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    max-width: 1100px;
    margin: 0 auto 3rem;
  }
  .transform-card {
    background: var(--charcoal);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    transition: transform 0.3s, border-color 0.3s;
  }
  .transform-card:hover {
    transform: translateY(-4px);
    border-color: rgba(201,168,76,0.3);
  }
  .transform-imgs {
    display: grid; grid-template-columns: 1fr 1fr;
    position: relative;
  }
  .transform-img-half {
    height: 200px;
    background-size: cover;
    background-position: center;
    position: relative;
  }
  .transform-label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.7);
    font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    padding: 0.3rem 0.5rem;
    text-align: center;
  }
  .transform-divider {
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 2px; background: var(--gold);
    z-index: 2;
    transform: translateX(-50%);
  }
  .transform-info {
    padding: 1.25rem;
  }
  .transform-name {
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 0.3rem;
  }
  .transform-result {
    color: var(--gold);
    font-size: 0.82rem;
    font-weight: 500;
    margin-bottom: 0.5rem;
  }
  .transform-quote {
    font-size: 0.82rem;
    color: rgba(255,255,255,0.55);
    line-height: 1.5;
    font-style: italic;
  }
  .transforms-cta { text-align: center; }
  /* ── PACKAGES ── */
  .packages-section { background: var(--black); }
  .packages-intro {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 4rem; align-items: end;
    margin-bottom: 4rem;
    max-width: 1100px; margin-left: auto; margin-right: auto;
  }
  .packages-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .pkg-card {
    background: var(--charcoal);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 4px;
    padding: 2rem;
    position: relative;
    transition: border-color 0.3s, transform 0.3s;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .pkg-card:hover {
    border-color: rgba(201,168,76,0.35);
    transform: translateY(-3px);
  }
  .pkg-card.featured {
    border-color: var(--gold);
    background: linear-gradient(160deg, rgba(201,168,76,0.08), var(--charcoal));
  }
  .pkg-badge {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    background: var(--gold);
    color: var(--black);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.3rem 1rem;
    border-radius: 2px;
    white-space: nowrap;
    z-index: 2;
  }
  .pkg-img {
    width: calc(100% + 4rem);
    margin: -2rem -2rem 1.5rem -2rem;
    display: block;
    object-fit: cover;
    height: 200px;
    border-radius: 4px 4px 0 0;
    mix-blend-mode: multiply;
  }
  .pkg-tag {
    font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.75rem;
  }
  .pkg-name {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    line-height: 1.2;
  }
  .pkg-tagline {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.55);
    margin-bottom: 1.5rem;
    line-height: 1.5;
    font-style: italic;
  }
  .pkg-price {
    margin-bottom: 1.5rem;
  }
  .pkg-price .currency { font-size: 1rem; color: var(--gold); vertical-align: top; margin-top: 4px; display: inline-block; }
  .pkg-price .amount {
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--white);
    line-height: 1;
  }
  .pkg-price .period { font-size: 0.8rem; color: rgba(255,255,255,0.4); }
  .pkg-features {
    list-style: none;
    margin-bottom: 2rem;
    flex: 1;
  }
  .pkg-features li {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.7);
    padding: 0.45rem 0;
    padding-left: 1.5rem;
    position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .pkg-features li::before {
    content: '→';
    position: absolute; left: 0;
    color: var(--gold);
    font-size: 0.75rem;
  }
  .pkg-btn {
    display: block;
    text-align: center;
    padding: 0.85rem;
    border-radius: 2px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    transition: background 0.2s, color 0.2s;
  }
  .pkg-btn:hover, .pkg-card.featured .pkg-btn {
    background: var(--gold);
    color: var(--black);
  }
  .pkg-card.featured .pkg-btn:hover {
    background: var(--gold-light);
  }
  /* ── WHY US ── */
  .why-section {
    background: var(--off-black);
  }
  .why-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .why-card {
    padding: 2rem;
    border-left: 2px solid rgba(201,168,76,0.25);
    transition: border-color 0.3s;
  }
  .why-card:hover { border-color: var(--gold); }
  .why-icon {
    font-size: 1.8rem; margin-bottom: 1rem;
    display: block;
  }
  .why-title {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 0.6rem;
  }
  .why-desc {
    font-size: 0.88rem;
    color: rgba(255,255,255,0.55);
    line-height: 1.7;
  }
  /* ── COACHES ── */
  .coaches-section { background: var(--black); }
  .coaches-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 3rem;
    max-width: 900px; margin: 0 auto;
  }
  .coach-card {
    background: var(--charcoal);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 4px;
    overflow: hidden;
  }
  .coach-photo {
    width: 100%; height: 420px;
    background-size: cover;
    background-position: center top;
    position: relative;
    overflow: hidden;
  }
  .coach-photo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(10,10,10,0.9) 100%);
  }
  .coach-info { padding: 2rem; }
  .coach-name {
    font-family: var(--font-display);
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
  }
  .coach-role {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.25rem;
  }
  .coach-bio {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.65);
    line-height: 1.7;
    margin-bottom: 1.5rem;
  }
  .coach-certs {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
  }
  .cert-tag {
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.25);
    color: var(--gold-light);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    padding: 0.3rem 0.7rem;
    border-radius: 2px;
    text-transform: uppercase;
  }
  /* ── TESTIMONIALS ── */
  .testimonials-section { background: var(--off-black); }
  .testimonials-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    max-width: 1100px; margin: 0 auto;
  }
  .testi-card {
    background: var(--charcoal);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 4px;
    padding: 2rem;
    position: relative;
  }
  .testi-stars {
    color: var(--gold); font-size: 0.9rem;
    margin-bottom: 1rem; letter-spacing: 2px;
  }
  .testi-quote {
    font-size: 0.92rem;
    color: rgba(255,255,255,0.75);
    line-height: 1.75;
    font-style: italic;
    margin-bottom: 1.5rem;
  }
  .testi-author {
    display: flex; align-items: center; gap: 0.75rem;
  }
  .testi-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.9rem;
    color: var(--black);
    flex-shrink: 0;
  }
  .testi-name {
    font-weight: 600; font-size: 0.9rem;
  }
  .testi-detail {
    font-size: 0.75rem;
    color: var(--gold);
    margin-top: 0.15rem;
  }
  /* ── 1-TO-1 PT ── */
  .pt-section {
    background: var(--black);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    padding: 0;
  }
  .pt-photo {
    background: url('https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=900&q=80') center/cover no-repeat;
    min-height: 600px;
    position: relative;
  }
  .pt-photo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to right, transparent 60%, rgba(10,10,10,0.5));
  }
  .pt-content {
    padding: 5rem 4rem;
    background: var(--charcoal);
    display: flex; flex-direction: column; justify-content: center;
  }
  .pt-locations {
    display: flex; flex-direction: column; gap: 1rem;
    margin: 2rem 0;
  }
  .location-pill {
    display: flex; align-items: center; gap: 1rem;
    background: rgba(201,168,76,0.08);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 4px;
    padding: 1rem 1.25rem;
  }
  .location-icon { font-size: 1.4rem; }
  .location-name { font-weight: 600; font-size: 0.95rem; }
